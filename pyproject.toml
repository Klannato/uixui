[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uispec"
version = "0.3.0"
description = "Annotate UI screenshots and hand specs to coding agents"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["ui", "design", "screenshots", "annotation", "agents", "specification", "pyside6", "qt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: User Interfaces",
]
dependencies = ["PySide6>=6.6", "qtawesome>=1.3"]

[project.urls]
Homepage = "https://github.com/Klannato/uispec"
Repository = "https://github.com/Klannato/uispec"
Issues = "https://github.com/Klannato/uispec/issues"
Changelog = "https://github.com/Klannato/uispec/commits/main"

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
uispec = "uispec.cli:main"
uispec-app = "uispec.gui.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
uispec = ["skill/ui-spec/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
